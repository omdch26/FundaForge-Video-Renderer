<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 420" width="824" height="420">
<rect width="824" height="420" fill="#0B0F17"/>
<text x="412" y="40" font-family="JetBrains Mono, monospace" font-size="18" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Same code. Same weights. Falling accuracy.</text>

<rect x="26" y="70" width="248" height="196" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
<text x="150" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="bold">DATA DRIFT</text>
<text x="150" y="116" font-family="Inter, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">the inputs moved</text>
<path d="M50 190 Q90 150 130 178 T210 186" stroke="#64748B" stroke-width="2" fill="none"/>
<path d="M50 208 Q100 158 150 196 T250 200" stroke="#06B6D4" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<text x="150" y="232" font-family="Inter, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">younger customers, new channel</text>
<rect x="46" y="240" width="208" height="18" rx="3" fill="#0B0F17" stroke="#06B6D4" stroke-width="1"/>
<text x="150" y="253" font-family="JetBrains Mono, monospace" font-size="9" fill="#06B6D4" text-anchor="middle">VISIBLE TODAY · NO LABELS NEEDED</text>

<rect x="288" y="70" width="248" height="196" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
<text x="412" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="bold">CONCEPT DRIFT</text>
<text x="412" y="116" font-family="Inter, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">the rule moved</text>
<line x1="312" y1="200" x2="512" y2="160" stroke="#64748B" stroke-width="2"/>
<line x1="312" y1="170" x2="512" y2="212" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/>
<text x="412" y="232" font-family="Inter, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">recession, competitor, policy change</text>
<rect x="308" y="240" width="208" height="18" rx="3" fill="#0B0F17" stroke="#F59E0B" stroke-width="1"/>
<text x="412" y="253" font-family="JetBrains Mono, monospace" font-size="9" fill="#F59E0B" text-anchor="middle">NEEDS OUTCOMES · ARRIVES LATE</text>

<rect x="550" y="70" width="248" height="196" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
<text x="674" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="bold">LABEL DRIFT</text>
<text x="674" y="116" font-family="Inter, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">the categories moved</text>
<rect x="588" y="150" width="70" height="30" rx="4" fill="#0B0F17" stroke="#64748B" stroke-width="1.5"/>
<text x="623" y="170" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">"default"</text>
<path d="M664 165 L696 165" stroke="#64748B" stroke-width="2"/>
<path d="M688 159 L698 165 L688 171 Z" fill="#64748B"/>
<rect x="700" y="150" width="70" height="30" rx="4" fill="#0B0F17" stroke="#F59E0B" stroke-width="1.5"/>
<text x="735" y="170" font-family="Inter, sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">redefined</text>
<text x="674" y="212" font-family="Inter, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">policy changed what counts</text>
<text x="674" y="232" font-family="Inter, sans-serif" font-size="10" fill="#F8FAFC" text-anchor="middle">as the thing you predict</text>
<rect x="570" y="240" width="208" height="18" rx="3" fill="#0B0F17" stroke="#64748B" stroke-width="1"/>
<text x="674" y="253" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748B" text-anchor="middle">SILENT · NOBODY TELLS THE MODEL</text>

<rect x="26" y="288" width="772" height="56" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="412" y="312" font-family="JetBrains Mono, monospace" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="bold">THE LAG IS THE REAL PROBLEM</text>
<text x="412" y="332" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">a loan defaults after a year — by the time you can prove the rule changed, the model has been using the old one all along</text>

<text x="412" y="378" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Diagnose the type before reaching for a fix. Retraining does not repair a broken pipeline.</text>
</svg>
